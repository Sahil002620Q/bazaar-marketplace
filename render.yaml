services:
  - type: web
    name: bazaar-api-server
    env: node
    rootDir: artifacts/api-server
    buildCommand: pnpm install && pnpm run build
    startCommand: node ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
